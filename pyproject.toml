[project]
name = "spec-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.137.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pint>=0.26.1",
    "pydantic>=2.14.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docling: runs the Docling PDF pipeline (slow; deselect with -m 'not docling')",
    "llm: calls the local Ollama model; runs only with RUN_LLM=1",
]
filterwarnings = [
    # Docling's own code still touches its deprecated options (not our settings).
    "ignore:`force_full_page_ocr` is deprecated:DeprecationWarning",
    "ignore:This field is deprecated:DeprecationWarning:docling.pipeline.standard_pdf_pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.isort]
known-first-party = ["spec_bridge", "tests"]

[[tool.mypy.overrides]]
# docling-core re-exports its public classes from docling_core.types.doc without __all__.
module = ["docling_core.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# pypdfium2 ships no type information.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# rank_bm25 ships no type information (W4-R R2).
module = ["rank_bm25"]
ignore_missing_imports = true
