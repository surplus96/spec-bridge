  - {label: "Bore:", attribute: bore, origin: synthetic, source: REF-2S-02, location: {pdf_page: 26}, verified_by: null}
  - {label: "Stroke:", attribute: stroke, origin: synthetic, source: REF-2S-02, location: {pdf_page: 26}, verified_by: null}
  - {label: "Number of cylinders:", attribute: number_of_cylinders, origin: synthetic, source: REF-2S-02, location: {pdf_page: 26}, verified_by: null}
  - {label: "Power [kW]", attribute: rated_power, origin: synthetic, source: REF-2S-02, location: {pdf_page: 29}, verified_by: null}
  - {label: "Speed [rpm]", attribute: rated_speed, origin: synthetic, source: REF-2S-02, location: {pdf_page: 29}, verified_by: null}
  - {label: Number of cylinder, attribute: number_of_cylinders, origin: synthetic, source: REF-4S-02, location: {pdf_page: 10}, verified_by: null}
  - {label: Cylinder bore mm, attribute: bore, origin: synthetic, source: REF-4S-02, location: {pdf_page: 10}, verified_by: null}
  - {label: Piston stroke mm, attribute: stroke, origin: synthetic, source: REF-4S-02, location: {pdf_page: 10}, verified_by: null}
  - {label: Engine (kWm), attribute: rated_power, origin: synthetic, source: REF-4S-02, location: {pdf_page: 18}, verified_by: null}
  - {label: Engine Output Range per Turbocharger, attribute: applicable_engine_power, origin: synthetic, source: REF-TC-02, location: {pdf_page: 8}, verified_by: null}
