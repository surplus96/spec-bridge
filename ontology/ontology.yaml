version: 0
origin: synthetic
dimensions:                      
  dimensionless: "dimensionless"
  length: "[length]"
  mass: "[mass]"
  power: "[length] ** 2 * [mass] / [time] ** 3"
  pressure: "[mass] / [length] / [time] ** 2"
  volume_flow: "[length] ** 3 / [time]"
  rotational_frequency: "1 / [time]"
  frequency: "1 / [time]"
  temperature: "[temperature]"
  kinematic_viscosity: "[length] ** 2 / [time]"
units:                           
  mm: {pint: millimeter}
  m: {pint: meter}
  kg: {pint: kilogram}
  kW: {pint: kilowatt}
  bar: {pint: bar}
  m3/h: {pint: "meter**3/hour"}
  rpm: {pint: revolutions_per_minute}
  l/h: {pint: "liter/hour"}
  Hz: {pint: hertz}
  degC: {pint: degree_Celsius}
  mbar: {pint: millibar}
  cSt: {pint: centistokes}
attributes:
  maker: {datatype: string, dimension: dimensionless, canonical_unit: null}
  model_designation: {datatype: string, dimension: dimensionless, canonical_unit: null}
  dimensions: {datatype: dimensions, dimension: length, canonical_unit: mm}
  dry_weight: {datatype: number, dimension: mass, canonical_unit: kg}
  reported_weight: {datatype: number, dimension: mass, canonical_unit: kg}
  medium: {datatype: string, dimension: dimensionless, canonical_unit: null}
  motor_power: {datatype: number, dimension: power, canonical_unit: kW}
  pump_type: {datatype: string, dimension: dimensionless, canonical_unit: null}
  capacity: {datatype: number, dimension: volume_flow, canonical_unit: m3/h}
  head: {datatype: number, dimension: length, canonical_unit: m}
  differential_pressure: {datatype: number, dimension: pressure, canonical_unit: bar}
  discharge_pressure: {datatype: number, dimension: pressure, canonical_unit: bar}
  cooling_type: {datatype: string, dimension: dimensionless, canonical_unit: null}
  max_pressure: {datatype: number, dimension: pressure, canonical_unit: bar}
  working_pressure: {datatype: number, dimension: pressure, canonical_unit: bar}
  application: {datatype: string, dimension: dimensionless, canonical_unit: null}
  rated_throughput: {datatype: number, dimension: volume_flow, canonical_unit: l/h}
  self_cleaning: {datatype: boolean, dimension: dimensionless, canonical_unit: null}
  rated_power: {datatype: number, dimension: power, canonical_unit: kW}
  rated_speed: {datatype: number, dimension: rotational_frequency, canonical_unit: rpm}
  number_of_cylinders: {datatype: integer, dimension: dimensionless, canonical_unit: null}
  fuel_types: {datatype: string_set, dimension: dimensionless, canonical_unit: null}
  bore: {datatype: number, dimension: length, canonical_unit: mm}
  stroke: {datatype: number, dimension: length, canonical_unit: mm}
  turbocharger_type: {datatype: string, dimension: dimensionless, canonical_unit: null}
  applicable_engine_power: {datatype: [number, range], dimension: power, canonical_unit: kW}
  bearing_type: {datatype: string, dimension: dimensionless, canonical_unit: null}

classes:
  Equipment:
    abstract: true
    parent: null
    attributes: [maker, model_designation, dimensions, dry_weight, reported_weight]
  FluidMachinery:
    abstract: true
    parent: Equipment
    attributes: [medium, motor_power]
  Pump:
    abstract: false
    parent: FluidMachinery
    label: Pump
    keywords: [pump]
    attributes: [pump_type, capacity, head, differential_pressure, discharge_pressure]
    required_all: [maker, model_designation, pump_type, capacity]
    required_any_groups: []
    conditional_required:
      - when: {pump_type: centrifugal}
        required_all: [head]
      - when: {pump_type: three_screw}
        required_any_groups: [[differential_pressure, discharge_pressure]]
  Engine:
    abstract: true
    parent: Equipment
    attributes: [rated_power, rated_speed, number_of_cylinders, fuel_types]
  EngineComponent:
    abstract: true
    parent: Equipment
    attributes: []
  AirCompressor:
    abstract: false
    parent: FluidMachinery
    label: Air compressor
    keywords: [air compressor]
    attributes: [capacity, max_pressure, working_pressure, cooling_type]
    required_all: [maker, model_designation, capacity]
    required_any_groups: [[max_pressure, working_pressure]]
  Separator:
    abstract: false
    parent: FluidMachinery
    label: Separator
    keywords: [separator]
    attributes: [application, rated_throughput, self_cleaning]
    required_all: [maker, model_designation, application, rated_throughput]
    allowed_values: {application: [fuel_oil, lube_oil]}
  TwoStrokeMainEngine:
    abstract: false
    parent: Engine
    label: Two-stroke main engine
    keywords: [two-stroke]
    attributes: [bore, stroke]
    required_all: [maker, model_designation, rated_power, rated_speed, number_of_cylinders]
  FourStrokeEngine:
    abstract: false
    parent: Engine
    label: Four-stroke engine
    keywords: [four-stroke]
    attributes: [application, bore, stroke]
    required_all: [maker, model_designation, application, rated_power, rated_speed, number_of_cylinders]
    allowed_values: {application: [propulsion, genset]}
  Turbocharger:
    abstract: false
    parent: EngineComponent
    label: Turbocharger
    keywords: [turbocharger]
    attributes: [turbocharger_type, applicable_engine_power, bearing_type]
    required_all: [maker, model_designation, turbocharger_type, applicable_engine_power]
label_aliases:
