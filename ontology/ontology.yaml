vocabularies:
  basis:
    capacity: [free_air_delivery, charging_capacity, unknown]
    rating: [nominal, motor_rated, maximum_capacity, continuous_engine_shaft, MCR, maximum, working, unknown]
    pressure: [gauge, absolute, not_applicable, unknown]
    weight: [dry, unknown]
  condition:
    medium: {kind: token, values: [HFO, lubricating_oil]}
    viscosity_basis: {kind: token, values: [fuel_reference, fluid_reference]}
    rating_point: {kind: token, values: [R1, R2]}
    engine_type: {kind: token, values: [two-stroke, four-stroke]}
    basis: {kind: token, values: [per_turbocharger]}
    frequency: {kind: quantity, dimension: frequency}
    temperature: {kind: quantity, dimension: temperature}
    absolute_pressure: {kind: quantity, dimension: pressure}
    viscosity: {kind: reference_quantity, dimension: kinematic_viscosity}
  descriptions:
    origin: synthetic
    verified_by: null
    basis:
      capacity:
        _: How the stated capacity is defined.
        free_air_delivery: Capacity stated as free air delivery.
        charging_capacity: Capacity stated as charging capacity.
      rating:
        _: Which rating the stated value refers to.
        nominal: Nominal rating.
        motor_rated: Rating stated as motor rated.
        maximum_capacity: Rating at maximum capacity.
        continuous_engine_shaft: Continuous rating at the engine shaft.
        maximum: Maximum rating.
        working: Working rating.
      pressure:
        _: Whether a stated pressure is gauge or absolute.
        gauge: Pressure stated as gauge pressure.
        absolute: Pressure stated as absolute pressure.
      weight:
        _: Which weight condition the stated value refers to.
        dry: Weight stated for the dry condition.
    condition:
      medium:
        _: The medium the value applies to.
        lubricating_oil: The value applies when handling lubricating oil.
      viscosity_basis:
        _: How the viscosity condition is referenced.
        fuel_reference: The viscosity condition is stated as a fuel reference.
        fluid_reference: The viscosity condition is stated as a fluid reference.
      rating_point:
        _: The rating point the value is stated at, as labelled in the document.
      engine_type:
        _: The engine type the value applies to.
        two-stroke: The value applies to two-stroke engines.
        four-stroke: The value applies to four-stroke engines.
      basis:
        _: The unit the value is counted per.
        per_turbocharger: The value is stated per turbocharger.
      frequency:
        _: The frequency at which the value is stated.
      temperature:
        _: The temperature at which the value is stated.
      absolute_pressure:
        _: The absolute pressure at which the value is stated.
      viscosity:
        _: The viscosity at which the value is stated, with its reference temperature.
    scope:
      optional: >-
        The part of the equipment or supply that the value refers to, as written in the
        document. Leave it empty when the value refers to the main product itself.
      required_none: >-
        The part of the equipment or supply that the value refers to, as written in the
        document. Use "none" when the value refers to the main product itself.
