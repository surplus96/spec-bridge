  - {label: Charging capacity, attribute: capacity, origin: synthetic, source: REF-COMP-02, location: {pdf_page: 5}, verified_by: null}
  - {label: Nominal working pressure, attribute: working_pressure, origin: synthetic, source: REF-COMP-01, location: {pdf_page: 10}, verified_by: null}
