      application:
        meaning: 엔진의 주 사용 용도
        conditions_and_basis: propulsion/genset 후보; 공급 품목과 주 용도를 구별
        evidence_summary: F1 p.33/35, F2 p.8/18; S 1.3/1.4/표1/3.1
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
        dataset_allowed_values:
          values:
          - propulsion
          - genset
          origin: synthetic
          scope: supported registration application categories in this synthetic dataset; not exhaustive industry
            ontology
          unlisted_explicit_value: E4 only when a stated value is outside this closed dataset list
          unmentioned_value: unknown/review, never assume E4
      rated_power:
        meaning: 주 엔진 전체의 정격 출력
        conditions_and_basis: Engine kWm/Generator kWe, Normal/Higher, ICN/ICFN 등의 명시 기준 보존; 단위 kW만으로 동일화 금지
        evidence_summary: F1 p.33~35, F2 p.18; S 표5/3.1
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
      rated_speed:
        meaning: 출력 정격에 대응하는 엔진 회전수
        conditions_and_basis: 주파수·출력 정격과 대응; 발전기 극수를 엔진 속성으로 대체하지 않음
        evidence_summary: F2 p.10/18; F1 p.33; S 표6/3.1
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
      number_of_cylinders:
        meaning: 주 엔진의 실린더 수
        conditions_and_basis: 발전기 극수나 형식명 숫자와 구별; 범위 표는 모델별 구성으로 보존
        evidence_summary: F2 p.8/10; F1 p.33; S 표2
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
      fuel_types:
        meaning: 명시된 운전 연료 목록
        conditions_and_basis: 원문 연료명·규격과 합성 약칭의 동등성은 검증 후 사전 연결
        evidence_summary: F1 p.33; S 표7. S의 MDO/MGO와 원본 DMA의 일반 동등성은 미확정
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
      bore:
        meaning: 주 엔진의 실린더 보어
        conditions_and_basis: 사양 표의 값과 형식명 설명의 단위를 구별; 이름만으로 수치 복원하지 않음
        evidence_summary: F2 p.8/10; S 표3
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
      stroke:
        meaning: 주 엔진의 피스톤 행정
        conditions_and_basis: 보어와 순서 및 단위 구별
        evidence_summary: F2 p.8/10; S 표4
        source_definition: docs/ontology-scope/four-stroke-engine.md
        verified_by: null
