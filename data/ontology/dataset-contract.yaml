fact_contract:
  identity:
  - document
  - attribute
  - condition
  - basis
  - scope
  required_evidence:
  - raw_text
  - location
  repeated_occurrences: one fact, multiple source locations; one scoring unit
  conditional_values: distinct conditions produce distinct facts; no conflict merely because values differ
  unknown: preserve unknown; do not treat unknown contexts as equal
  empty_required_value: empty text/list or unresolved observation does not satisfy required attribute
  zero_and_false: preserve as values; no physical limits asserted
  unit_policy: canonical units apply to normalized answers; retain original unit text; no bare bhp/BHP/ton default
    conversion
  missing_policy: required policies are synthetic registration-readiness labels, not faulty equipment judgments
metadata_contract:
  basis:
  - capacity
  - rating
  - pressure
  - weight
  condition:
  - medium
  - viscosity
  - viscosity_basis
  - temperature
  - absolute_pressure
  - frequency
  - rating_point
  - engine_type
  - basis
  scope: explicit object/component boundary or unknown
  viscosity: quantity with optional reference_temperature; preserve fuel_reference versus inlet
  pressure_basis:
  - gauge
  - absolute
  - unknown
  - not_applicable
  gold_v2_aliases:
    capacity_basis: basis.capacity
    rating_basis: basis.rating
    pressure_basis: basis.pressure
    weight_basis: basis.weight
    reference_conditions: condition
    conditional_values: additional facts of same attribute
  representation: legacy gold v2 viscosity text remains allowed; structured form may be introduced only with a versioned
    gold migration
relations:
  manufactured_by:
    target: Manufacturer
    representation: maker text in current gold; synthetic registry ID in future data
    origin: synthetic
  has_component:
    target: Equipment
    meaning: supply-scope (BOM) inclusion of an identified product; not physical attachment, mechanical
      compatibility or equipment selection (D-014)
    representation: identified model/registry reference list; generic component mention is not a confirmed product
      link
    origin: synthetic
  variant_of:
    target: Equipment
    representation: explicit family reference or null; similarity alone does not prove relation
    origin: synthetic
  external_ref:
    representation: optional external classification reference; codes unresolved and not required for dataset completion
    origin: synthetic
excluded_rules:
- manufacturer aliases and model-name parsing inferred from memory
- physical acceptance ranges without verified source
- automatic head/pressure equivalence
- generic Weight implies dry_weight
- silent enum defaulting or universal enum exhaustiveness
evaluation_separation:
  current_six: design-exposed supplemental candidates; not independent held-out test
  score_units_unchanged: 56
  extensions:
  - reported_weight
  - differential_pressure
  - discharge_pressure
  - working_pressure
  extension_policy: allowed in new authoring; do not add absent attributes as missing errors to old gold without
    explicit revision
  input_policy: product document bodies only; no answer, contract, manifest or case-design metadata in document
    input
