task: DATA-CASE-PLAN
origin: synthetic
status: final_v1; frozen by user decision D-019 (2026-10-08); reviewed_by awaits user signature
seed: 20261007
seed_scope: neutral input ID assignment only; future values/templates must record their own deterministic generation
  procedure
contract: data/ontology/dataset-contract.yaml
contract_version: 2
targets:
  documents: 40
  classes:
    Pump: 7
    AirCompressor: 7
    Separator: 7
    FourStrokeEngine: 7
    TwoStrokeMainEngine: 6
    Turbocharger: 6
  formats:
    pdf: 20
    xlsx: 12
    docx: 8
  splits:
    dev: 24
    test: 16
  primary_cases:
    normal: 10
    E1: 6
    E2: 4
    E3: 4
    E4: 4
    E5: 2
    E6: 6
    E7: 4
  registry_records: 150
  comparison_pairs: 10
  boms: 4
split_policy:
  key: family_id
  family_shared_across_splits: false
  shared_identity: all renderings/revisions of one product remain in one family and split
  registry: dev/test separate snapshots; test family records not used to build dev aliases/prompts/thresholds
  bom: root and component records must belong to same split
  existing_handwritten: six design-exposed candidates remain supplemental; no reuse of their maker/model/family
    or body in main test
  held_out_status: family-disjoint evaluation only; agent authored both partitions and plan, not human independent
    or externally blinded
  freeze: hash actual documents, answers, registry, rules and split map before model experiment; plan is not
    a frozen dataset
case_definitions:
  normal: no E1-E5 or comparison-positive requirement; V1/context variations permitted
  E1: required value absent under dataset contract
  E2: explicit wrong unit dimension; preserve raw observation and do not invent a normalized number
  E3: declared value shape violated; no manufacturer pattern rules from memory
  E4: explicit application outside synthetic allowed categories; no unverified physical ranges
  E5: inconsistent values under explicitly identical condition/basis/scope; record both locations
  E6: same synthetic registry product; preserved identity and facts after declared normalization
  E7: different product in explicitly same synthetic family; not an inferred industry similarity threshold
