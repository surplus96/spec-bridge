    location: p.1
  - source_id: BOMSRC-06
    location: p.1
  - source_id: BOMSRC-07
    location: p.1
  - source_id: BOMSRC-08
    location: p.1
  verified_by: Codex (2026-10-17; 사용자 승인에 따른 이번 BOM 검토 한정, D-106)
- id: PAT-12
  pattern_type: quantity_in_words
  description: 수량이 영어 단어로, 또는 단어와 괄호 숫자를 함께 써서 적힌다
  source_refs:
  - source_id: BOMSRC-04
